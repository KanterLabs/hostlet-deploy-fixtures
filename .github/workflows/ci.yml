name: Fixture CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout fixture source
        uses: actions/checkout@v5
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Validate fixture manifest
        run: node scripts/validate-manifest.mjs
      - name: Check whitespace
        run: git diff --check

  generated-runtime-contracts:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout fixture source
        uses: actions/checkout@v5
      - name: Set up the project Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: "stable"
          components: rustfmt, clippy
      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Install pinned Go toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.23.x"
          cache-dependency-path: apps/go-api/go.mod
      - name: Check generated runtime entrypoints
        run: |
          node --check apps/node-npm/server.js
          node --check apps/yarn-api/server.js
          node --check apps/managed-services/server.js
          node --check apps/workspace-websocket/packages/server/src/index.js
          python3 -m py_compile apps/python-fastapi/main.py
      - name: Check Go fixture
        run: go test ./...
        working-directory: apps/go-api
      - name: Check Rust fixture
        run: cargo check --locked
        working-directory: apps/rust-axum
